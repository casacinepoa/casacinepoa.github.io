<article class="post_item">
  {%- include post/meta.html -%}

  <h3 class="title">
    <a href="{{ post.url | relative_url }}" rel="bookmark">
      {{ post.title }}
    </a>
  </h3>

  <div class="excerpt">
    {% if post.image %}
      <img src="{{ post.image }}" alt="" />
    {% else %}
      {{ post.excerpt }}
    {% endif %}
  </div>

  <a class="continue_reading" href="{{ post.url | relative_url }}" rel="bookmark">
    Leia mais
  </a>
</article>
